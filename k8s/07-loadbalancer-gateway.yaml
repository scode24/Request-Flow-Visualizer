apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadbalancer
  namespace: request-flow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loadbalancer
  template:
    metadata:
      labels:
        app: loadbalancer
    spec:
      containers:
        - name: nginx-lb
          image: nginx:alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: loadbalancer-service
  namespace: request-flow
spec:
  type: LoadBalancer
  selector:
    app: loadbalancer
  ports:
    - name: http
      port: 80
      targetPort: 80
