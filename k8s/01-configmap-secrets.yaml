apiVersion: v1
kind: ConfigMap
metadata:
  name: flow-config
  namespace: request-flow
data:
  NODE_ENV: "production"
  PORT: "4000"
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "flow_visualizer"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  MINIO_ENDPOINT: "minio"
  MINIO_PORT: "9000"
  MINIO_USE_SSL: "false"
  MINIO_BUCKET: "request-flow-bucket"
  BACKEND_TARGET_CPU: "65"
  BACKEND_MIN_REPLICAS: "2"
  BACKEND_MAX_REPLICAS: "8"
---
apiVersion: v1
kind: Secret
metadata:
  name: flow-secrets
  namespace: request-flow
type: Opaque
stringData:
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "postgresClusterSecret123!"
  REDIS_PASSWORD: ""
  MINIO_ACCESS_KEY: "minioadmin"
  MINIO_SECRET_KEY: "minioadmin"
